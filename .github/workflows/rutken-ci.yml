# rutken:managed v1 -- generated by Rutken Security; edit gate settings in
# the Rutken GUI (CI/CD tab), not here. Hand edits will be overwritten on
# re-provision. Remove this header to take manual ownership.
# rutken:config fail_on=medium pipeline_fail_on=high apk=app.apk baseline=on
name: Rutken Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  RUTKEN_HOME: ${{ github.workspace }}/.rutken

jobs:
  rutken:
    name: Rutken scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Rutken CI binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download rutken-cicd \
            --repo "$GITHUB_REPOSITORY" \
            -p 'rutken-cicd-x86_64-linux' -O rutken
          chmod +x rutken

      - name: Provision Rutken entitlement
        env:
          RUTKEN_ENTITLEMENT_JWT: ${{ secrets.RUTKEN_ENTITLEMENT_JWT }}
        run: |
          mkdir -p "$RUTKEN_HOME"
          printf '%s' "$RUTKEN_ENTITLEMENT_JWT" > "$RUTKEN_HOME/entitlement.jwt"

      - name: Pipeline gate
        run: ./rutken cicd scan .github/workflows --fail-on high

      - name: APK gate
        if: ${{ hashFiles('app.apk') != '' }}
        uses: ./.github/actions/rutken-scan
        with:
          apk: app.apk
          rutken-path: ./rutken
          fail-on: medium
          baseline: ${{ hashFiles('ci/rutken-baseline.json') != '' && 'ci/rutken-baseline.json' || '' }}
          artifact-uri: app.apk
          step-summary: 'true'

      - name: Upload SARIF
        if: ${{ always() && hashFiles('rutken.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rutken.sarif
