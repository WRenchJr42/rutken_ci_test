name: Rutken CI

# Rutken as a build gate on every push to main and every PR, using a
# PREBUILT minimal rutken binary pulled from Azure (no source checkout,
# no cargo build):
#  1. Fetch the prebuilt binary from the SAS URL (secret RUTKEN_BINARY_URL).
#  2. Install the entitlement JWT (secret RUTKEN_ENTITLEMENT_JWT) so the
#     paid CI gates (CiGate / CicdConfigScan) are granted at runtime.
#  3. APK gate + PR comment + SARIF - via the vendored rutken-scan action.
#     Fails only on findings NEW/ESCALATED vs ci/rutken-baseline.json.
#  4. Upload SARIF - surfaces findings in Security > Code scanning.
#  5. Pipeline scan - scan this repo's own workflow files.
#
# Secrets needed: RUTKEN_BINARY_URL (7-day read-only Azure SAS to the
# prebuilt binary; re-mint weekly) and RUTKEN_ENTITLEMENT_JWT (the verbatim
# contents of a Pro+ ~/.rutken/entitlement.jwt; re-export on expiry).
# RUTKEN_REPO_TOKEN is no longer used - remove it.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  RUTKEN_HOME: ${{ github.workspace }}/.rutken

jobs:
  rutken:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Fetch prebuilt Rutken binary (Azure SAS)
        env:
          RUTKEN_BINARY_URL: ${{ secrets.RUTKEN_BINARY_URL }}
        run: |
          curl -fsSL "$RUTKEN_BINARY_URL" -o rutken
          chmod +x rutken
          ./rutken --version

      - name: Install entitlement
        env:
          RUTKEN_ENTITLEMENT_JWT: ${{ secrets.RUTKEN_ENTITLEMENT_JWT }}
        run: |
          mkdir -p "$RUTKEN_HOME"
          printf '%s' "$RUTKEN_ENTITLEMENT_JWT" > "$RUTKEN_HOME/entitlement.jwt"

      - name: APK gate + PR comment + SARIF
        id: scan
        uses: ./.github/actions/rutken-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          apk: app.apk
          rutken-path: ./rutken
          baseline: ci/rutken-baseline.json
          fail-on: medium
          comment: 'true'
          artifact-uri: app.apk

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rutken.sarif

      - name: Scan pipeline definitions
        run: ./rutken cicd scan . --fail-on high
