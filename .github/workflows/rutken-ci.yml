name: Rutken CI

# Rutken as a build gate on every push to main and every PR:
#  1. APK gate + PR comment - via the rutken-scan composite action (built
#     from the private source in rutken-src). Fails only on findings
#     NEW/ESCALATED vs ci/rutken-baseline.json; on PRs posts an idempotent
#     baseline-delta summary comment; writes SARIF anchored to app.apk.
#  2. Upload SARIF - surfaces findings in the repo's Security > Code scanning.
#  3. Pipeline scan - scan this repo's own workflow files.
# Needs repo secret RUTKEN_REPO_TOKEN (read access to the private rutken repo).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  rutken:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out Rutken (private source)
        uses: actions/checkout@v4
        with:
          repository: WRenchJr42/rutken_static_analyzer_private
          ref: phase-23.9-33-24-12
          token: ${{ secrets.RUTKEN_REPO_TOKEN }}
          path: rutken-src

      - name: Build rutken
        run: cargo build --release -p cli --manifest-path rutken-src/Cargo.toml

      - name: APK gate + PR comment + SARIF
        id: scan
        uses: ./rutken-src/.github/actions/rutken-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          apk: app.apk
          rutken-path: rutken-src/target/release/rutken
          baseline: ci/rutken-baseline.json
          fail-on: medium
          comment: 'true'
          artifact-uri: app.apk

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rutken.sarif

      - name: Scan pipeline definitions
        run: >-
          rutken-src/target/release/rutken cicd scan .github/workflows
          --fail-on high
