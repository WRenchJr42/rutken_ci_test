name: Rutken CI

# Rutken as a build gate on every push to main and every PR:
#  1. APK gate + PR comment - via the rutken-scan composite action (built
#     from the private source checked out to rutken-src). Fails only on
#     findings NEW/ESCALATED vs ci/rutken-baseline.json, and (on PRs) posts
#     an idempotent baseline-delta summary comment.
#  2. Pipeline scan - scan this repo's own workflow files for insecure
#     CI/CD patterns.
# Needs repo secret RUTKEN_REPO_TOKEN (read access to the private rutken repo).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  rutken:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out Rutken (private source)
        uses: actions/checkout@v4
        with:
          repository: WRenchJr42/rutken_static_analyzer_private
          ref: phase-23.9-33-24-12
          token: ${{ secrets.RUTKEN_REPO_TOKEN }}
          path: rutken-src

      - name: Build rutken
        run: cargo build --release -p cli --manifest-path rutken-src/Cargo.toml

      - name: APK gate + PR comment
        uses: ./rutken-src/.github/actions/rutken-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          apk: app.apk
          rutken-path: rutken-src/target/release/rutken
          baseline: ci/rutken-baseline.json
          fail-on: medium
          comment: 'true'
          comment-token: GITHUB_TOKEN

      - name: Scan pipeline definitions
        run: >-
          rutken-src/target/release/rutken cicd scan .github/workflows
          --fail-on high
